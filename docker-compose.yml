name: typing-course

services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Override untuk koneksi antar-container & production
      DATABASE_URL: postgres://${POSTGRES_USER:-olshop}:${POSTGRES_PASSWORD:-olshop_pass_2024}@postgres:5432/${POSTGRES_DB:-typing_course}
      APP_URL: ${APP_URL:-https://typing.fadlur.com}
      APP_ENV: production
      APP_PORT: 3200
      COOKIE_SECURE: "true"
    ports:
      - "127.0.0.1:3200:3200"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3200/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-olshop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-olshop_pass_2024}
      POSTGRES_DB: ${POSTGRES_DB:-typing_course}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-olshop} -d ${POSTGRES_DB:-typing_course}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
